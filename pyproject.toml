[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mule-torch"
version = "0.1.0"
description = "Unofficial PyTorch port of MULE (SF-NFNet-F0), the SiriusXM/Pandora music-audio embedding model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Matteo Spanio", email = "spanio@dei.unipd.it" }]
keywords = ["mule", "music", "audio", "embeddings", "nfnet", "pytorch", "representation-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies are torch-only: this is a clean inference library. Everything
# needed to *convert* weights from the original TF model or to *verify* parity lives
# in the standalone uv scripts under scripts/ (run with `uv run`), not here.
dependencies = [
    "torch>=2.1",
    "numpy>=1.23",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
# For running the test suite (mel-vs-librosa exactness + ONNX export checks).
dev = [
    "pytest>=7",
    "librosa>=0.10",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "onnxscript>=0.1",
]

[project.urls]
Homepage = "https://github.com/matteospanio/mule-torch"
Repository = "https://github.com/matteospanio/mule-torch"
"Upstream (original TF)" = "https://github.com/PandoraMedia/music-audio-representations"
Paper = "https://arxiv.org/abs/2210.03799"

[tool.hatch.build.targets.wheel]
packages = ["src/mule_torch"]

[tool.pytest.ini_options]
markers = [
    "requires_weights: test needs converted safetensors weights (set MULE_TORCH_WEIGHTS).",
    "requires_tf_ref: test needs reference numpy dumps from the original TF pipeline (set MULE_TF_REF).",
]
testpaths = ["tests"]
